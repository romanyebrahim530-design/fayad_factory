name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Configure Google Services Plugin
        run: |
          # Add buildscript with google-services classpath to android/build.gradle if not present
          if ! grep -q "buildscript" android/build.gradle; then
            sed -i '1i buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.google.gms:google-services:4.4.2"\n    }\n}\n' android/build.gradle
          fi
          
          # Apply plugin at the bottom of android/app/build.gradle
          if ! grep -q "google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
          
          # Update minSdk to 23
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
