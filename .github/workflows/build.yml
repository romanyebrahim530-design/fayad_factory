name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Initialize Flutter Project Structure
        run: flutter create . --project-name fayad_factory --platforms=android
      - name: Setup google-services.json and Sync Package Name
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi
          
          if [ -f "android/app/google-services.json" ]; then
            PKG_NAME=$(grep -o '"package_name": "[^"]*"' android/app/google-services.json | head -1 | cut -d'"' -f4)
            echo "Extracted Package Name: $PKG_NAME"
            if [ ! -z "$PKG_NAME" ] && [ -f "android/app/build.gradle" ]; then
              sed -i "s/applicationId \".*\"/applicationId \"$PKG_NAME\"/g" android/app/build.gradle
            fi
          fi
      - name: Configure Gradle for Firebase
        run: |
          if [ -f "android/build.gradle" ]; then
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              if grep -q "buildscript {" android/build.gradle; then
                sed -i '/buildscript {/a \    dependencies {\n        classpath "com.google.gms:google-services:4.4.2"\n    }' android/build.gradle
              else
                sed -i '1i buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.google.gms:google-services:4.4.2"\n    }\n}\n' android/build.gradle
              fi
            fi
          fi

          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi

            if grep -q "minSdkVersion" android/app/build.gradle; then
              sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
            else
              sed -i '/defaultConfig {/a \        minSdkVersion 23' android/app/build.gradle
            fi
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
