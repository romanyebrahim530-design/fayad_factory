name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: flutter create . --project-name fayad_factory --platforms=android
      - name: Configure Google Services Plugin
        run: |
          sed -i '/dependencies {/a \    classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Update minSdk to 23
        run: |
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
